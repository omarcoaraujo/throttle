name: Check
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ github.token }}
          version: 2.5.2
          args: --config-path stylua.toml --check src tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}
      - run: lute run tests
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
        with:
          token: ${{ github.token }}
      - run: rojo sourcemap default.project.json --output sourcemap.json
      - run: curl -sL https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau -o globalTypes.d.luau
      - run: luau-lsp analyze --definitions=globalTypes.d.luau --sourcemap=sourcemap.json src tests
