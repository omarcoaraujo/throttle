name: Release
on:
  workflow_dispatch:
  release:
    types: [published]
jobs:
  check:
    uses: ./.github/workflows/check.yml
    secrets: inherit
  publish:
    runs-on: ubuntu-latest
    needs: [check]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Tag must equal the version
        run: |
          version="$(grep -m1 '^version' pesde.toml | cut -d'"' -f2)"
          test "${{ github.event.release.tag_name }}" = "$version"
      - uses: axiom-co/setup-pesde@b690699ace34169731b6b2a1c93b2008472038a7
        with:
          token: ${{ github.token }}
      - run: pesde auth login --token "$PESDE_AUTH"
        env:
          PESDE_AUTH: ${{ secrets.PESDE_AUTH }}
      - run: pesde install
      - run: pesde publish -y
